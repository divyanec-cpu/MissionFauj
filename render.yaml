# Render blueprint — https://render.com/docs/blueprint-spec
# Deploys the auth backend only (server/). This repo's frontend is a static
# SPA built separately (Capacitor/Android + your own static hosting), not
# part of this blueprint.
#
# DATABASE_URL is deliberately `sync: false` rather than a `databases:` block
# with `fromDatabase` auto-wiring: this is the first time MissionFauj needs a
# database, so provisioning it is a deliberate one-time action for you to take
# in the Render dashboard (New > PostgreSQL), not something a blueprint push
# should silently create. Paste the resulting connection string in manually.
#
# No MSG91 vars here: OTP send/verify happens client-side (browser calls
# MSG91 directly) since Render's outbound IP gets intermittently blocked by
# MSG91's widget anti-abuse layer. The widget credentials live in the
# frontend build's VITE_MSG91_* env vars instead.
services:
  - type: web
    name: missionfauj-otp-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    # Migrations are NOT run automatically on deploy/restart — run
    # `npx prisma migrate deploy` as a separate, deliberate step (e.g. via
    # Render's Shell) after reviewing the migration, same discipline as any
    # change touching a real database.
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Server-only secret for the AI Assist backend calls. Set the real
      # value directly in Render's dashboard after deploy — never paste it
      # in chat or commit it, same discipline as DATABASE_URL/JWT_SECRET.
      - key: ANTHROPIC_API_KEY
        sync: false
      # MSG91 account authkey (server-only, NOT the widget credentials, which
      # are client-side VITE_ vars). Enables server-side verification of the
      # OTP access token in /auth/verify-otp. Until it is set the sign-in gate
      # is forgeable — see /admin/diagnostics, which reports the live mode.
      - key: MSG91_AUTH_KEY
        sync: false
      # Bootstraps the first real /admin login (email+password, not a shared
      # token) the first time the server boots with an empty AdminUser table.
      # Pick your own values and set them directly in Render's dashboard —
      # never generateValue, since you need to know them to log in.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
